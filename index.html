<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Stockholm</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Montserrat:ital,wght@0,100..900;1,100..900&family=Nunito:ital,wght@0,200..1000;1,200..1000&family=Open+Sans:ital,wght@0,300..800;1,300..800&family=PT+Sans:ital,wght@0,400;0,700;1,400;1,700&family=Ubuntu:ital,wght@0,300;0,400;0,500;0,700;1,300;1,400;1,500;1,700&display=swap"
      rel="stylesheet"
    />
    <link
      rel="stylesheet"
      href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/4.7.0/css/font-awesome.min.css"
    />
    <link rel="stylesheet" href="./css/reset.css" />
    <link rel="stylesheet" href="./css/index.css" />
  </head>
  <body>
    <header class="header">
      <div class="header__logo">
        <img
          class="header__logo-image"
          src="./assets/Logo-dark.webp"
          alt="logo"
        />
      </div>
      <nav class="header__nav">
        <a href="#" class="header__link header__link--active">Main</a>
        <a href="#" class="header__link">About</a>
        <a href="#" class="header__link">Contact</a>
      </nav>
      <button class="header__burger">
        <svg
          xmlns="http://www.w3.org/2000/svg"
          width="18"
          height="19"
          fill="none"
        >
          <g
            stroke="#000"
            stroke-miterlimit="10"
            stroke-width="1.999"
            clip-path="url(#a)"
          >
            <path d="M.006 1h17.988M.006 9.095h17.988M.006 17.19h17.988" />
          </g>
          <defs>
            <clipPath id="a">
              <path fill="#fff" d="M0 0h18v18.19H0z" />
            </clipPath>
          </defs>
        </svg>
      </button>
    </header>

    <footer class="footer">

        <div class="footer__top">
          <img
            src="./assets/Footer-logo.webp"
